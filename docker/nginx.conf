# Static file server for the AML prototype. Runs as non-root (65532) on a read-only root
# filesystem: every writable path points to /tmp, which is mounted as tmpfs at runtime.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 15s;
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        autoindex off;
        absolute_redirect off;
        disable_symlinks on;

        # Server-level responses (e.g. the 405 below) get the headers too.
        include /etc/nginx/security-headers.conf;

        # The app only reads static files.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        # No dotfiles (e.g. .git, .env) even if they ever end up in the image.
        location ~ /\. {
            include /etc/nginx/security-headers.conf;
            return 404;
        }

        # Liveness/readiness probe for orchestrators (the image has no shell or curl).
        location = /healthz {
            include /etc/nginx/security-headers.conf;
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Hashed build output: cache for a year.
        location /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # index.html and other files: always revalidate so new deployments are picked up.
        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri /index.html;
        }
    }
}
