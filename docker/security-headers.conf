# Security headers for every response (included at server level and in each location, because
# nginx does not inherit add_header into a location that sets its own). "always" covers errors.
# Rationale: docs/adrs/0019-secure-container-deployment.md

# CSP: only same-origin scripts; no eval, no inline scripts, no plugins, no framing, no form posts.
# 'unsafe-inline' for styles only: React style attributes, Radix positioning and the shadcn chart <style>.
# No upgrade-insecure-requests: TLS terminates at the proxy and HSTS forces HTTPS; the directive
# would break plain-HTTP local runs on localhost.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;

# HSTS: 2 years incl. subdomains. Only honoured over HTTPS (TLS terminates at the ingress/proxy).
# Add "; preload" only after deciding to submit the domain to the HSTS preload list.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=(), clipboard-read=(), clipboard-write=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Origin-Agent-Cluster "?1" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header X-DNS-Prefetch-Control "off" always;
